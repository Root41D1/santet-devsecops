name: Publish hardened cloud runtime

on:
  push:
    branches: [main]
    paths:
      - docker/prowler/Dockerfile
      - .github/workflows/publish-cloud-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santet-cloud-runtime
  cancel-in-progress: false

jobs:
  publish:
    name: security-gate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-prowler" >> "$GITHUB_OUTPUT"

      - name: Build local security-gate image
        run: make prowler-smoke

      - name: Scan runtime vulnerabilities
        run: |
          docker run --rm \
            --security-opt=no-new-privileges --cap-drop=ALL \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            santet-prowler:5.42.0-r1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish hardened runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/prowler/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:5.42.0-r1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=5.42.0-r1
          cache-from: type=gha,scope=prowler-runtime
          cache-to: type=gha,mode=max,scope=prowler-runtime
          provenance: mode=max
          sbom: true
