name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Application tests
        run: |
          echo "Replace this step with the repository's build, lint, and test commands."

      - name: Secret scan
        if: always()
        run: make secrets

      - name: Static analysis
        if: always()
        run: make sast

      - name: Dependency scan
        if: always()
        run: make dependencies

      - name: Filesystem and IaC scan
        if: always()
        run: make filesystem

      - name: Generate source SBOM
        if: always()
        run: make sbom

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence-${{ github.run_id }}
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Gitleaks SARIF
        if: always() && hashFiles('artifacts/security/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/gitleaks.sarif
          category: gitleaks

      - name: Publish Semgrep SARIF
        if: always() && hashFiles('artifacts/security/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/semgrep.sarif
          category: semgrep

      - name: Publish Trivy SARIF
        if: always() && hashFiles('artifacts/security/trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/trivy-filesystem.sarif
          category: trivy-filesystem
